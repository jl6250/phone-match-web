services:
  phone-match-web:
    build: .
    image: phone-match-web:latest
    ports:
      - "${PHONE_MATCH_PORT:-8501}:8501"
    environment:
      ODPS_ACCESS_ID: ${ODPS_ACCESS_ID:-}
      ODPS_ACCESS_KEY: ${ODPS_ACCESS_KEY:-}
      ODPS_PROJECT: ${ODPS_PROJECT:-superengineproject}
      ODPS_ENDPOINT: ${ODPS_ENDPOINT:-https://service.cn.maxcompute.aliyun.com/api}
    restart: unless-stopped
